name: Central images
on:
  push:
    branches: [feat/central-opensearch-migration]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immutable commit-tagged images to GHCR
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: central-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 ci/central/check.py
  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        component: ["ruuter"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Log in to GHCR
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
      - name: Build, test and optionally publish
        env:
          PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          COMPONENT: ${{ matrix.component }}
        run: |
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(--publish); fi
          python3 ci/central/build.py --component "$COMPONENT" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: central-image-${{ matrix.component }}-${{ github.sha }}
          path: .central-build/*.json
          include-hidden-files: true
          if-no-files-found: error
